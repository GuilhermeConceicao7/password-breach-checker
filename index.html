<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Breach Checker</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/zxcvbn.js" defer ></script>
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Password Breach Checker</h1>
  <p>Check if your password has appeared in a data breach — without it ever leaving your browser.</p>

  <div>
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      autocomplete="new-password"
      spellcheck="false"
      autocapitalize="off"
      autocorrect="off"
    >
    <button type="button" id="toggle">Show</button>
  </div>

  <section id="results" aria-live="polite">
    <h2>Strength</h2>
    <meter id="strength-meter" min="0" max="4" value="0"></meter>
    <p id="strength"></p>

    <h2>Breach check</h2>
    <p id="breach"></p>

    <h2>Feedback</h2>
    <p id="feedback"></p>
  </section>
  <section>
  <h2>Passphrase generator</h2>
  <button type="button" id="generate">Generate passphrase</button>
  <output id="passphrase"></output>
  <p id="passphrase-info"></p>
  </section>
</body>
</html>
